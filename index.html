<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Handball Scoreboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    padding: 15px;
    max-width: 1400px;
    margin: auto;
}

h1 {
    font-size: 35px;
    margin: 10px 0;
}

.scoreboard {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: 40px;
    gap: 10px;
}

.team {
    width: 32%;
}

.team-name {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 15px;
}

.score {
    font-size: 120px;
    color: red;
    font-weight: bold;
}

.timer {
    font-size: 90px;
    color: yellow;
    font-weight: bold;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.green {
    background: green;
    color: white;
}

.red {
    background: red;
    color: white;
}

.blue {
    background: blue;
    color: white;
}

.orange {
    background: orange;
    color: black;
}

.gray {
    background: #555;
    color: white;
}

.admin-btn {
    background: white;
    color: black;
}

.control {
    display: none;
}

#adminStatus {
    font-size: 18px;
    color: yellow;
    margin: 10px;
}

@media(max-width:700px) {

    h1 {
        font-size: 24px;
    }

    .scoreboard {
        margin-top: 20px;
    }

    .team-name {
        font-size: 22px;
    }

    .score {
        font-size: 70px;
    }

    .timer {
        font-size: 48px;
    }

    button {
        font-size: 15px;
        padding: 10px 12px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>HANDBALL SCOREBOARD</h1>


<!-- ADMIN -->

<button class="admin-btn" onclick="openAdmin()">
ADMIN
</button>

<div id="adminStatus">
Viewing Mode
</div>


<!-- SCOREBOARD -->

<div class="scoreboard">


<!-- TEAM A -->

<div class="team">

<div class="team-name" id="teamAName">
AMDAVAD CITY
</div>

<div class="score" id="scoreA">
0
</div>

<div class="control">

<button class="green"
onclick="changeScore('A',1)">
+1
</button>

<button class="red"
onclick="changeScore('A',-1)">
-1
</button>

</div>

</div>


<!-- TIME -->

<div>

<div class="timer" id="timer">
20:00
</div>

<div class="control">

<button class="blue"
onclick="startTimer()">
START
</button>

<button class="orange"
onclick="stopTimer()">
STOP
</button>

<br>

<button class="gray"
onclick="resetTimer()">
RESET
</button>

</div>

</div>


<!-- TEAM B -->

<div class="team">

<div class="team-name" id="teamBName">
KHEDA
</div>

<div class="score" id="scoreB">
0
</div>

<div class="control">

<button class="green"
onclick="changeScore('B',1)">
+1
</button>

<button class="red"
onclick="changeScore('B',-1)">
-1
</button>

</div>

</div>


</div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    databaseURL:
    "https://scoreboard-app-2faa3-default-rtdb.firebaseio.com"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =========================
   VARIABLES
========================= */

let scoreA = 0;
let scoreB = 0;

let totalSeconds = 1200;

let timerRunning = false;
let timerEndAt = null;

let isAdmin = false;

const ADMIN_PIN = "1516";


/* =========================
   ADMIN
========================= */

window.openAdmin = function() {

    if (isAdmin) {

        logoutAdmin();

        return;
    }


    const pin =
        prompt("Enter Admin PIN");


    if (pin === ADMIN_PIN) {

        isAdmin = true;


        document.getElementById("adminStatus")
            .innerText = "ADMIN MODE ON";


        document.getElementById("adminStatus")
            .style.color = "lightgreen";


        document.querySelectorAll(".control")
            .forEach(function(element) {

                element.style.display = "block";

            });


        document.querySelector(".admin-btn")
            .innerText = "EXIT ADMIN";

    }

    else {

        alert("Wrong PIN!");

    }

};


/* =========================
   LOGOUT
========================= */

function logoutAdmin() {

    isAdmin = false;


    document.getElementById("adminStatus")
        .innerText = "Viewing Mode";


    document.getElementById("adminStatus")
        .style.color = "yellow";


    document.querySelectorAll(".control")
        .forEach(function(element) {

            element.style.display = "none";

        });


    document.querySelector(".admin-btn")
        .innerText = "ADMIN";

}


/* =========================
   LIVE FIREBASE DATA
========================= */

onValue(

    ref(db),

    function(snapshot) {

        const data =
            snapshot.val();


        if (!data) {

            return;

        }


        /* SCORE */

        if (data.score) {

            scoreA =
                Number(data.score.A || 0);

            scoreB =
                Number(data.score.B || 0);

        }


        document.getElementById("scoreA")
            .innerText = scoreA;


        document.getElementById("scoreB")
            .innerText = scoreB;


        /* TIMER */

        if (data.timer) {

            totalSeconds =
                Number(
                    data.timer.time ?? 1200
                );


            timerRunning =
                data.timer.running || false;


            timerEndAt =
                data.timer.endAt || null;

        }

    },

    function(error) {

        console.log(
            "Firebase error:",
            error
        );

    }

);


/* =========================
   SCORE
========================= */

window.changeScore =
function(team, value) {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;

    }


    if (team === "A") {

        scoreA += value;


        if (scoreA < 0) {

            scoreA = 0;

        }

    }


    if (team === "B") {

        scoreB += value;


        if (scoreB < 0) {

            scoreB = 0;

        }

    }


    /* SCREEN */

    document.getElementById("scoreA")
        .innerText = scoreA;


    document.getElementById("scoreB")
        .innerText = scoreB;


    /* FIREBASE */

    set(

        ref(db, "score"),

        {
            A: scoreA,
            B: scoreB
        }

    )
    .then(function() {

        console.log("Score saved");

    })
    .catch(function(error) {

        alert(
            "Score save error: " +
            error.message
        );

    });

};


/* =========================
   TIMER DISPLAY
========================= */

function updateTimerDisplay() {

    let seconds =
        totalSeconds;


    if (
        timerRunning &&
        timerEndAt
    ) {

        seconds =
            Math.max(

                0,

                Math.ceil(

                    (timerEndAt - Date.now())
                    / 1000

                )

            );

    }


    const minutes =
        Math.floor(seconds / 60);


    const sec =
        seconds % 60;


    document.getElementById("timer")
        .innerText =

        minutes +
        ":" +
        String(sec).padStart(2, "0");


    if (
        timerRunning &&
        seconds <= 0
    ) {

        timerRunning = false;

        timerEndAt = null;

        totalSeconds = 0;

    }

}


/* =========================
   TIMER LOOP
========================= */

setInterval(

    function() {

        updateTimerDisplay();

    },

    250

);


/* =========================
   START
========================= */

window.startTimer =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;

    }


    if (timerRunning) {

        return;

    }


    if (totalSeconds <= 0) {

        totalSeconds = 1200;

    }


    timerEndAt =
        Date.now() +
        (totalSeconds * 1000);


    timerRunning = true;


    set(

        ref(db, "timer"),

        {
            time: totalSeconds,
            running: true,
            endAt: timerEndAt
        }

    )
    .catch(function(error) {

        alert(
            "Timer error: " +
            error.message
        );

    });

};


/* =========================
   STOP
========================= */

window.stopTimer =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;

    }


    if (!timerRunning) {

        return;

    }


    totalSeconds =
        Math.max(

            0,

            Math.ceil(

                (timerEndAt - Date.now())
                / 1000

            )

        );


    timerRunning = false;

    timerEndAt = null;


    set(

        ref(db, "timer"),

        {
            time: totalSeconds,
            running: false,
            endAt: null
        }

    )
    .catch(function(error) {

        alert(
            "Timer error: " +
            error.message
        );

    });

};


/* =========================
   RESET TIMER
========================= */

window.resetTimer =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;

    }


    totalSeconds = 1200;

    timerRunning = false;

    timerEndAt = null;


    document.getElementById("timer")
        .innerText = "20:00";


    set(

        ref(db, "timer"),

        {
            time: 1200,
            running: false,
            endAt: null
        }

    )
    .catch(function(error) {

        alert(
            "Timer reset error: " +
            error.message
        );

    });

};

</script>

</body>
</html>
