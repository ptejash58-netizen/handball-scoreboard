<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Handball Scoreboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    padding: 15px;
    max-width: 1400px;
    margin: auto;
}

h1 {
    font-size: 35px;
    margin: 10px 0;
}

.scoreboard {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: 40px;
    gap: 20px;
}

.team {
    width: 32%;
}

/* TEAM NAME BOX */

.team-name {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 15px;

    border: 3px solid white;
    border-radius: 10px;
    padding: 12px 10px;

    min-height: 70px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #111;
}

.score {
    font-size: 120px;
    color: red;
    font-weight: bold;
}

.timer {
    font-size: 90px;
    color: yellow;
    font-weight: bold;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.green {
    background: green;
    color: white;
}

.red {
    background: red;
    color: white;
}

.blue {
    background: blue;
    color: white;
}

.orange {
    background: orange;
    color: black;
}

.gray {
    background: #555;
    color: white;
}

.admin-btn {
    background: white;
    color: black;
}

.control {
    display: none;
}

#adminStatus {
    font-size: 18px;
    color: yellow;
    margin: 10px;
}


/* TEAM NAME + TIME SETTINGS */

.team-settings {
    display: none;
    margin-top: 30px;
    padding: 20px;
    border: 2px solid #555;
    border-radius: 10px;
}

.team-input {
    width: 250px;
    padding: 12px;
    margin: 5px;
    font-size: 18px;
    border-radius: 6px;
    border: none;
    text-align: center;
}

.time-input {
    width: 150px;
    padding: 12px;
    margin: 5px;
    font-size: 18px;
    border-radius: 6px;
    border: none;
    text-align: center;
}

.save-names {
    background: #00aaff;
    color: white;
}

.settings-title {
    font-size: 20px;
    margin: 8px;
    color: yellow;
}


@media(max-width:700px) {

    h1 {
        font-size: 24px;
    }

    .scoreboard {
        margin-top: 20px;
        gap: 5px;
    }

    .team-name {
        font-size: 22px;
        min-height: 55px;
        padding: 8px 5px;
    }

    .score {
        font-size: 70px;
    }

    .timer {
        font-size: 48px;
    }

    button {
        font-size: 15px;
        padding: 10px 12px;
    }

    .team-input {
        width: 90%;
        max-width: 300px;
    }

    .time-input {
        width: 90%;
        max-width: 200px;
    }

}

</style>

</head>

<body>

<div class="container">

<h1>SGFI U-19 BOYS HANDBALL STATE TOURNAMENT AT-BILIMORA (NAVSARI)</h1>


<!-- ADMIN -->

<button class="admin-btn" onclick="openAdmin()">
ADMIN
</button>

<div id="adminStatus">
Viewing Mode
</div>


<!-- SCOREBOARD -->

<div class="scoreboard">


<!-- TEAM A -->

<div class="team">

<div class="team-name" id="teamAName">
AMDAVAD CITY
</div>

<div class="score" id="scoreA">
0
</div>

<div class="control">

<button class="green"
onclick="changeScore('A',1)">
+1
</button>

<button class="red"
onclick="changeScore('A',-1)">
-1
</button>

</div>

</div>


<!-- TIME -->

<div>

<div class="timer" id="timer">
0:00
</div>

<div class="control">

<button class="blue"
onclick="startTimer()">
START
</button>

<button class="orange"
onclick="stopTimer()">
STOP
</button>

<br>

<button class="gray"
onclick="resetTimer()">
RESET
</button>

</div>

</div>


<!-- TEAM B -->

<div class="team">

<div class="team-name" id="teamBName">
KHEDA
</div>

<div class="score" id="scoreB">
0
</div>

<div class="control">

<button class="green"
onclick="changeScore('B',1)">
+1
</button>

<button class="red"
onclick="changeScore('B',-1)">
-1
</button>

</div>

</div>

</div>


<!-- TEAM NAME + MATCH TIME SETTINGS -->

<div class="team-settings" id="teamSettings">

<div class="settings-title">
TEAM A NAME
</div>

<input
id="teamAInput"
class="team-input"
placeholder="TEAM A NAME">


<div class="settings-title">
TEAM B NAME
</div>

<input
id="teamBInput"
class="team-input"
placeholder="TEAM B NAME">


<div class="settings-title">
MATCH TIME (MINUTES)
</div>

<input
id="matchTimeInput"
class="time-input"
type="number"
min="1"
placeholder="Example: 20">


<br>

<button
class="save-names"
onclick="saveTeamNames()">
SAVE TEAM NAMES & TIME
</button>

</div>


</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    databaseURL:
    "https://scoreboard-app-2faa3-default-rtdb.firebaseio.com"

};

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =========================
   VARIABLES
========================= */

let scoreA = 0;
let scoreB = 0;


/*
   MATCH TIME
   Default = 20 minutes
*/

let matchMinutes = 20;


/*
   TIMER NOW COUNTS UP
   0:00 → 1:00 → 2:00 → ... → MATCH TIME
*/

let totalSeconds = 0;

let timerRunning = false;

let timerStartAt = null;

let isAdmin = false;

const ADMIN_PIN = "1516";


/* =========================
   ADMIN
========================= */

window.openAdmin = function() {

    if (isAdmin) {

        logoutAdmin();

        return;
    }


    const pin =
        prompt("Enter Admin PIN");


    if (pin === ADMIN_PIN) {

        isAdmin = true;


        document.getElementById("adminStatus")
            .innerText = "ADMIN MODE ON";


        document.getElementById("adminStatus")
            .style.color = "lightgreen";


        document.querySelectorAll(".control")
            .forEach(function(element) {

                element.style.display = "block";

            });


        document.querySelector(".admin-btn")
            .innerText = "EXIT ADMIN";


        /* SHOW SETTINGS */

        document.getElementById("teamSettings")
            .style.display = "block";


        /* CURRENT TEAM NAMES */

        document.getElementById("teamAInput")
            .value =
            document.getElementById("teamAName")
            .innerText;


        document.getElementById("teamBInput")
            .value =
            document.getElementById("teamBName")
            .innerText;


        /* CURRENT MATCH TIME */

        document.getElementById("matchTimeInput")
            .value = matchMinutes;

    }

    else {

        alert("Wrong PIN!");

    }

};


/* =========================
   LOGOUT
========================= */

function logoutAdmin() {

    isAdmin = false;


    document.getElementById("adminStatus")
        .innerText = "Viewing Mode";


    document.getElementById("adminStatus")
        .style.color = "yellow";


    document.querySelectorAll(".control")
        .forEach(function(element) {

            element.style.display = "none";

        });


    document.getElementById("teamSettings")
        .style.display = "none";


    document.querySelector(".admin-btn")
        .innerText = "ADMIN";

}


/* =========================
   LIVE FIREBASE DATA
========================= */

onValue(

    ref(db),

    function(snapshot) {

        const data =
            snapshot.val();


        if (!data) {

            return;

        }


        /* =====================
           SCORE
        ===================== */

        if (data.score) {

            scoreA =
                Number(data.score.A || 0);

            scoreB =
                Number(data.score.B || 0);

        }


        document.getElementById("scoreA")
            .innerText = scoreA;


        document.getElementById("scoreB")
            .innerText = scoreB;


        /* =====================
           TIMER
        ===================== */

        if (data.timer) {

            matchMinutes =
                Number(
                    data.timer.matchMinutes ?? 20
                );


            totalSeconds =
                Number(
                    data.timer.time ?? 0
                );


            timerRunning =
                data.timer.running || false;


            timerStartAt =
                data.timer.startAt || null;

        }


        /* =====================
           TEAM NAMES
        ===================== */

        if (data.teams) {

            if (data.teams.A) {

                document.getElementById("teamAName")
                    .innerText = data.teams.A;

            }


            if (data.teams.B) {

                document.getElementById("teamBName")
                    .innerText = data.teams.B;

            }

        }

    },

    function(error) {

        console.log(
            "Firebase error:",
            error
        );

    }

);


/* =========================
   SAVE TEAM NAMES + TIME
========================= */

window.saveTeamNames = function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;

    }


    let teamA =
        document.getElementById("teamAInput")
        .value.trim();


    let teamB =
        document.getElementById("teamBInput")
        .value.trim();


    let newMatchMinutes =
        Number(
            document.getElementById("matchTimeInput")
            .value
        );


    if (teamA === "") {

        alert("Enter Team A Name");

        return;

    }


    if (teamB === "") {

        alert("Enter Team B Name");

        return;

    }


    if (
        !newMatchMinutes ||
        newMatchMinutes < 1
    ) {

        alert("Enter Match Time in minutes");

        return;

    }


    /* SCREEN */

    document.getElementById("teamAName")
        .innerText = teamA;


    document.getElementById("teamBName")
        .innerText = teamB;


    matchMinutes =
        newMatchMinutes;


    /*
       New time setting:
       Timer starts from 0
    */

    totalSeconds = 0;

    timerRunning = false;

    timerStartAt = null;


    document.getElementById("timer")
        .innerText = "0:00";


    /* SAVE TEAM NAMES */

    set(

        ref(db, "teams"),

        {
            A: teamA,
            B: teamB
        }

    )
    .catch(function(error) {

        alert(
            "Team name save error: " +
            error.message
        );

    });


    /* SAVE MATCH TIME */

    set(

        ref(db, "timer"),

        {
            time: 0,
            running: false,
            startAt: null,
            matchMinutes: matchMinutes
        }

    )
    .then(function() {

        alert(
            "Team names and match time saved successfully"
        );

    })
    .catch(function(error) {

        alert(
            "Time save error: " +
            error.message
        );

    });

};


/* =========================
   SCORE
========================= */

window.changeScore =
function(team, value) {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;

    }


    if (team === "A") {

        scoreA += value;


        if (scoreA < 0) {

            scoreA = 0;

        }

    }


    if (team === "B") {

        scoreB += value;


        if (scoreB < 0) {

            scoreB = 0;

        }

    }


    document.getElementById("scoreA")
        .innerText = scoreA;


    document.getElementById("scoreB")
        .innerText = scoreB;


    set(

        ref(db, "score"),

        {
            A: scoreA,
            B: scoreB
        }

    )
    .catch(function(error) {

        alert(
            "Score save error: " +
            error.message
        );

    });

};


/* =========================
   TIMER DISPLAY
========================= */

function updateTimerDisplay() {

    let seconds =
        totalSeconds;


    /*
       COUNT UP TIMER

       0:00
       0:01
       0:02
       ...
       1:00
       2:00
       ...
    */

    if (
        timerRunning &&
        timerStartAt
    ) {

        seconds =
            Math.floor(

                (Date.now() - timerStartAt)
                / 1000

            );

    }


    const maximumSeconds =
        matchMinutes * 60;


    /*
       STOP AT MATCH TIME
    */

    if (seconds >= maximumSeconds) {

        seconds =
            maximumSeconds;


        if (timerRunning) {

            timerRunning = false;

            totalSeconds = maximumSeconds;

            timerStartAt = null;


            set(

                ref(db, "timer"),

                {
                    time: maximumSeconds,
                    running: false,
                    startAt: null,
                    matchMinutes: matchMinutes
                }

            );

        }

    }


    totalSeconds =
        seconds;


    const minutes =
        Math.floor(seconds / 60);


    const sec =
        seconds % 60;


    document.getElementById("timer")
        .innerText =

        minutes +
        ":" +
        String(sec).padStart(2, "0");

}


/* =========================
   TIMER LOOP
========================= */

setInterval(

    function() {

        updateTimerDisplay();

    },

    250

);


/* =========================
   START TIMER
========================= */

window.startTimer =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;

    }


    if (timerRunning) {

        return;

    }


    const maximumSeconds =
        matchMinutes * 60;


    if (totalSeconds >= maximumSeconds) {

        totalSeconds = 0;

    }


    /*
       Continue from current time
    */

    timerStartAt =
        Date.now() -
        (totalSeconds * 1000);


    timerRunning = true;


    set(

        ref(db, "timer"),

        {
            time: totalSeconds,
            running: true,
            startAt: timerStartAt,
            matchMinutes: matchMinutes
        }

    )
    .catch(function(error) {

        alert(
            "Timer error: " +
            error.message
        );

    });

};


/* =========================
   STOP TIMER
========================= */

window.stopTimer =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;

    }


    if (!timerRunning) {

        return;

    }


    totalSeconds =
        Math.floor(

            (Date.now() - timerStartAt)
            / 1000

        );


    const maximumSeconds =
        matchMinutes * 60;


    if (totalSeconds > maximumSeconds) {

        totalSeconds =
            maximumSeconds;

    }


    timerRunning = false;

    timerStartAt = null;


    set(

        ref(db, "timer"),

        {
            time: totalSeconds,
            running: false,
            startAt: null,
            matchMinutes: matchMinutes
        }

    )
    .catch(function(error) {

        alert(
            "Timer error: " +
            error.message
        );

    });

};


/* =========================
   RESET TIMER + SCORE
========================= */

window.resetTimer =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;

    }


    /* =====================
       SCORE RESET
    ===================== */

    scoreA = 0;

    scoreB = 0;


    document.getElementById("scoreA")
        .innerText = "0";


    document.getElementById("scoreB")
        .innerText = "0";


    /* =====================
       TIMER RESET
    ===================== */

    totalSeconds = 0;

    timerRunning = false;

    timerStartAt = null;


    document.getElementById("timer")
        .innerText = "0:00";


    /* =====================
       SAVE SCORE RESET
    ===================== */

    set(

        ref(db, "score"),

        {
            A: 0,
            B: 0
        }

    )
    .catch(function(error) {

        alert(
            "Score reset error: " +
            error.message
        );

    });


    /* =====================
       SAVE TIMER RESET
    ===================== */

    set(

        ref(db, "timer"),

        {
            time: 0,
            running: false,
            startAt: null,
            matchMinutes: matchMinutes
        }

    )
    .catch(function(error) {

        alert(
            "Timer reset error: " +
            error.message
        );

    });

};

</script>

</body>
</html>
