<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Handball Scoreboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    padding: 15px;
    max-width: 1400px;
    margin: auto;
}

h1 {
    font-size: 35px;
    margin: 10px 0;
}

.match-info {
    font-size: 20px;
    margin: 8px;
    color: #ccc;
}

.scoreboard {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: 30px;
    gap: 10px;
}

.team {
    width: 32%;
}

.team-name {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 15px;
}

.score {
    font-size: 120px;
    color: red;
    font-weight: bold;
}

.timer {
    font-size: 90px;
    color: yellow;
    font-weight: bold;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.green {
    background: green;
    color: white;
}

.red {
    background: red;
    color: white;
}

.blue {
    background: blue;
    color: white;
}

.orange {
    background: orange;
    color: black;
}

.admin-btn {
    background: white;
    color: black;
}

.gray {
    background: #555;
    color: white;
}

.yellow {
    background: #ffd400;
    color: black;
}

.darkred {
    background: #8b0000;
    color: white;
}

.purple {
    background: purple;
    color: white;
}

#adminStatus {
    font-size: 18px;
    color: yellow;
    margin: 10px;
}

.control {
    display: none;
}

input, select {
    padding: 10px;
    font-size: 17px;
    border-radius: 6px;
    border: none;
    margin: 4px;
    text-align: center;
}

.admin-box {
    margin-top: 15px;
}

.admin-section {
    display: none;
    background: #151515;
    padding: 15px;
    margin-top: 15px;
    border-radius: 12px;
}

.section-title {
    font-size: 24px;
    color: yellow;
    margin: 10px;
}

.panel {
    margin: 12px auto;
    padding: 12px;
    border: 1px solid #444;
    border-radius: 10px;
    max-width: 900px;
}

.records {
    text-align: left;
    max-width: 700px;
    margin: auto;
}

.record {
    padding: 8px;
    margin: 5px;
    background: #222;
    border-radius: 5px;
}

.timeout {
    color: orange;
    font-size: 22px;
}

.suspension {
    color: #00bfff;
    font-size: 20px;
}

.status {
    margin: 8px;
    font-size: 18px;
}

@media(max-width: 700px) {

    h1 {
        font-size: 24px;
    }

    .scoreboard {
        margin-top: 15px;
    }

    .team-name {
        font-size: 22px;
    }

    .score {
        font-size: 70px;
    }

    .timer {
        font-size: 48px;
    }

    button {
        font-size: 15px;
        padding: 10px 12px;
    }

    input, select {
        width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">

<h1 id="titleText">U-17 BOYS SGFI STATE</h1>

<div class="match-info">
    Match No: <span id="matchNoDisplay">1</span>
    &nbsp; | &nbsp;
    Date: <span id="dateDisplay">-</span>
</div>

<div id="adminPanel">

    <button class="admin-btn" onclick="openAdmin()">
        ADMIN
    </button>

</div>

<div id="adminStatus">
    Viewing Mode
</div>


<!-- SCOREBOARD -->

<div class="scoreboard">

    <!-- TEAM A -->

    <div class="team">

        <div class="team-name" id="teamAName">
            AMDAVAD CITY
        </div>

        <div class="score" id="scoreA">
            0
        </div>

        <div class="control">

            <button class="green"
                    onclick="changeScore('A',1)">
                +1 GOAL
            </button>

            <button class="red"
                    onclick="changeScore('A',-1)">
                -1
            </button>

        </div>

        <div class="status">
            <span id="timeoutA"></span>
        </div>

    </div>


    <!-- TIMER -->

    <div>

        <div class="timer" id="timer">
            20:00
        </div>

        <div class="control">

            <button class="blue"
                    onclick="startTimer()">
                START
            </button>

            <button class="orange"
                    onclick="stopTimer()">
                STOP
            </button>

            <br>

            <button class="gray"
                    onclick="resetTimer()">
                RESET TIMER
            </button>

        </div>

    </div>


    <!-- TEAM B -->

    <div class="team">

        <div class="team-name" id="teamBName">
            KHEDA
        </div>

        <div class="score" id="scoreB">
            0
        </div>

        <div class="control">

            <button class="green"
                    onclick="changeScore('B',1)">
                +1 GOAL
            </button>

            <button class="red"
                    onclick="changeScore('B',-1)">
                -1
            </button>

        </div>

        <div class="status">
            <span id="timeoutB"></span>
        </div>

    </div>

</div>


<!-- ADMIN CONTROL PANEL -->

<div class="admin-section" id="controlPanel">

    <div class="section-title">
        ADMIN CONTROL
    </div>


    <!-- MATCH SETTINGS -->

    <div class="panel">

        <div class="section-title">
            MATCH SETTINGS
        </div>

        <input id="titleInput"
               placeholder="Match Title">

        <input id="matchNoInput"
               type="number"
               placeholder="Match No">

        <input id="dateInput"
               type="date">

        <br>

        <input id="teamAInput"
               placeholder="Team A Name">

        <input id="teamBInput"
               placeholder="Team B Name">

        <br>

        <button class="blue"
                onclick="saveMatchSettings()">
            SAVE TEAM / MATCH
        </button>

    </div>


    <!-- TIMEOUT -->

    <div class="panel">

        <div class="section-title">
            TIMEOUT
        </div>

        <button class="orange"
                onclick="startTimeout('A')">
            TEAM A TIMEOUT
        </button>

        <button class="orange"
                onclick="startTimeout('B')">
            TEAM B TIMEOUT
        </button>

        <div class="timeout"
             id="timeoutDisplay">
        </div>

    </div>


    <!-- DISCIPLINE -->

    <div class="panel">

        <div class="section-title">
            PLAYER CARDS / SUSPENSION
        </div>

        <select id="cardTeam">
            <option value="A">TEAM A</option>
            <option value="B">TEAM B</option>
        </select>

        <input id="playerName"
               placeholder="Player Name / No">

        <br>

        <button class="yellow"
                onclick="giveCard('yellow')">
            🟨 YELLOW CARD
        </button>

        <button class="blue"
                onclick="giveCard('twoMin')">
            🔵 2 MIN
        </button>

        <button class="darkred"
                onclick="giveCard('red')">
            🟥 RED CARD
        </button>

    </div>


    <!-- RECORDS -->

    <div class="panel">

        <div class="section-title">
            MATCH RECORD
        </div>

        <div id="records"
             class="records">
        </div>

    </div>


    <!-- SAVE RESULT -->

    <div class="panel">

        <div class="section-title">
            MATCH RESULT
        </div>

        <button class="purple"
                onclick="saveFinalResult()">
            💾 SAVE FINAL RESULT
        </button>

        <button class="red"
                onclick="resetMatch()">
            RESET COMPLETE MATCH
        </button>

    </div>

</div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue,
    push
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyDdQaZ2rzJYgw-YKbchs06e2GrviPS9O4o",

    authDomain:
    "tejash-4a29b.firebaseapp.com",

    databaseURL:
     "https://scoreboard-app-2faa3-default-rtdb.firebaseio.com",

    projectId:
    "tejash-4a29b",

    storageBucket:
    "tejash-4a29b.firebasestorage.app",

    messagingSenderId:
    "1006513583161",

    appId:
    "1:1006513583161:web:0e11c433c61f096152c9e8"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* =========================
   VARIABLES
========================= */

let scoreA = 0;
let scoreB = 0;

let totalSeconds = 1200;

let timerRunning = false;
let timerEndAt = null;

let displayInterval = null;

let isAdmin = false;

let timeoutEndAt = null;
let timeoutTeam = null;

let recordsData = {};

const ADMIN_PIN = "1516";


/* =========================
   ADMIN
========================= */

window.openAdmin = function() {

    if (isAdmin) {

        logoutAdmin();

        return;
    }

    const pin = prompt("Enter Admin PIN");

    if (pin === ADMIN_PIN) {

        isAdmin = true;

        document.getElementById("adminStatus")
            .innerText = "ADMIN MODE ON";

        document.getElementById("adminStatus")
            .style.color = "lightgreen";

        document.querySelectorAll(".control")
            .forEach(x => x.style.display = "block");

        document.getElementById("controlPanel")
            .style.display = "block";

        document.querySelector(".admin-btn")
            .innerText = "EXIT ADMIN";

    } else {

        alert("Wrong PIN!");

    }

};


function logoutAdmin() {

    isAdmin = false;

    document.getElementById("adminStatus")
        .innerText = "Viewing Mode";

    document.getElementById("adminStatus")
        .style.color = "yellow";

    document.querySelectorAll(".control")
        .forEach(x => x.style.display = "none");

    document.getElementById("controlPanel")
        .style.display = "none";

    document.querySelector(".admin-btn")
        .innerText = "ADMIN";
}


/* =========================
   LIVE DATABASE
========================= */

onValue(ref(db), function(snapshot) {

    const data = snapshot.val();

    if (!data) return;


    /* SCORE */

    if (data.score) {

        scoreA = data.score.A || 0;
        scoreB = data.score.B || 0;

        document.getElementById("scoreA")
            .innerText = scoreA;

        document.getElementById("scoreB")
            .innerText = scoreB;
    }


    /* TIMER */

    if (data.timer) {

        totalSeconds =
            data.timer.time ?? 1200;

        timerRunning =
            data.timer.running || false;

        timerEndAt =
            data.timer.endAt || null;
    }


    /* MATCH */

    if (data.match) {

        const m = data.match;

        document.getElementById("titleText")
            .innerText =
            m.title || "U-17 BOYS SGFI STATE";

        document.getElementById("matchNoDisplay")
            .innerText =
            m.matchNo || 1;

        document.getElementById("dateDisplay")
            .innerText =
            m.date || "-";

        document.getElementById("teamAName")
            .innerText =
            m.teamA || "AMDAVAD CITY";

        document.getElementById("teamBName")
            .innerText =
            m.teamB || "KHEDA";

        if (isAdmin) {

            document.getElementById("titleInput")
                .value = m.title || "";

            document.getElementById("matchNoInput")
                .value = m.matchNo || 1;

            document.getElementById("dateInput")
                .value = m.date || "";

            document.getElementById("teamAInput")
                .value = m.teamA || "";

            document.getElementById("teamBInput")
                .value = m.teamB || "";
        }
    }


    /* TIMEOUT */

    if (data.timeout) {

        timeoutEndAt =
            data.timeout.endAt || null;

        timeoutTeam =
            data.timeout.team || null;

    }


    /* RECORDS */

    recordsData =
        data.records || {};

    displayRecords();

});


/* =========================
   SCORE
========================= */

window.changeScore =
function(team, value) {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;
    }


    if (team === "A") {

        scoreA += value;

        if (scoreA < 0)
            scoreA = 0;
    }


    if (team === "B") {

        scoreB += value;

        if (scoreB < 0)
            scoreB = 0;
    }


    set(ref(db, "score"), {

        A: scoreA,
        B: scoreB

    });


    /* GOAL SOUND */

    if (value > 0) {

        playGoalSound();

    }

};


/* =========================
   GOAL SOUND
========================= */

function playGoalSound() {

    try {

        const audio =
            new Audio(
                "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
            );

        audio.play();

    } catch(e) {

        console.log(e);

    }

}


/* =========================
   TIMER DISPLAY
========================= */

function updateTimerDisplay() {

    let seconds = totalSeconds;

    if (timerRunning && timerEndAt) {

        seconds =
            Math.max(
                0,
                Math.ceil(
                    (timerEndAt - Date.now()) / 1000
                )
            );

    }


    let minutes =
        Math.floor(seconds / 60);

    let sec =
        seconds % 60;

    let text =
        minutes + ":" +
        String(sec).padStart(2, "0");


    document.getElementById("timer")
        .innerText = text;


    if (timerRunning && seconds <= 0) {

        timerRunning = false;

        timerEndAt = null;

        totalSeconds = 0;

    }

}


/* =========================
   TIMER LOOP
========================= */

displayInterval =
setInterval(function() {

    updateTimerDisplay();

    updateTimeoutDisplay();

}, 250);


/* =========================
   START TIMER
========================= */

window.startTimer =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;
    }


    if (timerRunning)
        return;


    if (totalSeconds <= 0)
        totalSeconds = 1200;


    timerEndAt =
        Date.now() +
        (totalSeconds * 1000);

    timerRunning = true;


    set(ref(db, "timer"), {

        time: totalSeconds,

        running: true,

        endAt: timerEndAt

    });

};


/* =========================
   STOP TIMER
========================= */

window.stopTimer =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;
    }


    if (!timerRunning)
        return;


    totalSeconds =
        Math.max(
            0,
            Math.ceil(
                (timerEndAt - Date.now()) / 1000
            )
        );


    timerRunning = false;

    timerEndAt = null;


    set(ref(db, "timer"), {

        time: totalSeconds,

        running: false,

        endAt: null

    });

};


/* =========================
   RESET TIMER
========================= */

window.resetTimer =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;
    }


    timerRunning = false;

    timerEndAt = null;

    totalSeconds = 1200;


    set(ref(db, "timer"), {

        time: 1200,

        running: false,

        endAt: null

    });

};


/* =========================
   MATCH SETTINGS
========================= */

window.saveMatchSettings =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;
    }


    const title =
        document.getElementById("titleInput").value
        || "U-17 BOYS SGFI STATE";


    const matchNo =
        document.getElementById("matchNoInput").value
        || 1;


    const date =
        document.getElementById("dateInput").value
        || "-";


    const teamA =
        document.getElementById("teamAInput").value
        || "AMDAVAD CITY";


    const teamB =
        document.getElementById("teamBInput").value
        || "KHEDA";


    set(ref(db, "match"), {

        title: title,

        matchNo: matchNo,

        date: date,

        teamA: teamA,

        teamB: teamB

    });

};


/* =========================
   TIMEOUT
========================= */

window.startTimeout =
function(team) {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;
    }


    timeoutTeam = team;

    timeoutEndAt =
        Date.now() + 60000;


    set(ref(db, "timeout"), {

        team: team,

        endAt: timeoutEndAt

    });

};


/* =========================
   TIMEOUT DISPLAY
========================= */

function updateTimeoutDisplay() {

    const el =
        document.getElementById("timeoutDisplay");

    if (!timeoutEndAt) {

        el.innerText = "";

        return;
    }


    const remaining =
        Math.max(
            0,
            Math.ceil(
                (timeoutEndAt - Date.now()) / 1000
            )
        );


    if (remaining <= 0) {

        el.innerText = "";

        timeoutEndAt = null;

        timeoutTeam = null;

        return;
    }


    const teamName =
        timeoutTeam === "A"
        ? document.getElementById("teamAName").innerText
        : document.getElementById("teamBName").innerText;


    el.innerText =
        teamName +
        " TIMEOUT : " +
        remaining +
        " sec";

}


/* =========================
   PLAYER CARDS
========================= */

window.giveCard =
function(type) {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;
    }


    const team =
        document.getElementById("cardTeam").value;


    const player =
        document.getElementById("playerName").value.trim();


    if (!player) {

        alert("Enter Player Name / Number");

        return;
    }


    const teamName =
        team === "A"
        ? document.getElementById("teamAName").innerText
        : document.getElementById("teamBName").innerText;


    const newRecord =
        push(ref(db, "records"));


    let cardText = "";


    if (type === "yellow")
        cardText = "🟨 Yellow Card";


    if (type === "twoMin")
        cardText = "🔵 2 Minute Suspension";


    if (type === "red")
        cardText = "🟥 Red Card";


    set(newRecord, {

        team: team,

       teamName: team,

        player: player,

        type: type,

        text: cardText,

        time: new Date().toLocaleTimeString()

    });


    document.getElementById("playerName")
        .value = "";

};


/* =========================
   RECORD DISPLAY
========================= */

function displayRecords() {

    const box =
        document.getElementById("records");


    box.innerHTML = "";


    Object.values(recordsData).forEach(function(record) {

        const div =
            document.createElement("div");


        div.className = "record";


        div.innerText =
            record.teamName +
            " | Player: " +
            record.player +
            " | " +
            record.text +
            " | " +
            record.time;


        box.appendChild(div);

    });

}


/* =========================
   SAVE FINAL RESULT
========================= */

window.saveFinalResult =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;
    }


    const teamA =
        document.getElementById("teamAName").innerText;


    const teamB =
        document.getElementById("teamBName").innerText;


    const result =
        push(ref(db, "matchResults"));


    set(result, {

        matchNo:
            document.getElementById("matchNoDisplay").innerText,

        date:
            document.getElementById("dateDisplay").innerText,

        teamA: teamA,

        teamB: teamB,

        scoreA: scoreA,

        scoreB: scoreB,

        savedAt:
            new Date().toLocaleString()

    });


    alert("Final Result Saved Successfully!");

};


/* =========================
   RESET COMPLETE MATCH
========================= */

window.resetMatch =
function() {

    if (!isAdmin) {

        alert("Admin PIN required!");

        return;
    }


    if (!confirm(
        "Reset complete match?"
    )) {

        return;
    }


    scoreA = 0;

    scoreB = 0;

    totalSeconds = 1200;

    timerRunning = false;

    timerEndAt = null;

    timeoutEndAt = null;

    timeoutTeam = null;


    set(ref(db), {

        score: {

            A: 0,

            B: 0

        },

        timer: {

            time: 1200,

            running: false,

            endAt: null

        },

        timeout: {

            team: null,

            endAt: null

        },

        records: {}

    });


    alert("Match Reset Successfully!");

};


</script>

</body>
</html>
