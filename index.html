<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SGFI U-19 BOYS HANDBALL STATE TOURNAMENT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    padding: 15px;
    max-width: 1400px;
    margin: auto;
}

h1 {
    font-size: 35px;
    margin: 10px 0;
}

/* =========================
   GROUND
========================= */

.ground-box {
    border: 3px solid #555;
    border-radius: 15px;
    margin: 25px auto;
    padding: 15px;
    max-width: 1400px;
}

.ground-title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 15px;
}

.ground1-title {
    color: #00aaff;
}

.ground2-title {
    color: #00ff66;
}


/* =========================
   SCOREBOARD
========================= */

.scoreboard {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: 25px;
    gap: 20px;
}

.team {
    width: 32%;
}


/* TEAM NAME BOX */

.team-name {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 15px;

    border: 3px solid white;
    border-radius: 10px;
    padding: 12px 10px;

    min-height: 70px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #111;
}

.score {
    font-size: 120px;
    color: red;
    font-weight: bold;
}

.timer {
    font-size: 90px;
    color: yellow;
    font-weight: bold;
}


/* =========================
   BUTTONS
========================= */

button {
    padding: 12px 20px;
    font-size: 18px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.green {
    background: green;
    color: white;
}

.red {
    background: red;
    color: white;
}

.blue {
    background: blue;
    color: white;
}

.orange {
    background: orange;
    color: black;
}

.gray {
    background: #555;
    color: white;
}

.admin-btn {
    background: white;
    color: black;
}


/* =========================
   ADMIN
========================= */

.control {
    display: none;
}

.adminStatus {
    font-size: 18px;
    color: yellow;
    margin: 10px;
}


/* =========================
   SETTINGS
========================= */

.team-settings {
    display: none;
    margin-top: 30px;
    padding: 20px;
    border: 2px solid #555;
    border-radius: 10px;
}

.team-input {
    width: 250px;
    padding: 12px;
    margin: 5px;
    font-size: 18px;
    border-radius: 6px;
    border: none;
    text-align: center;
}

.time-input {
    width: 150px;
    padding: 12px;
    margin: 5px;
    font-size: 18px;
    border-radius: 6px;
    border: none;
    text-align: center;
}

.save-names {
    background: #00aaff;
    color: white;
}

.settings-title {
    font-size: 20px;
    margin: 8px;
    color: yellow;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    h1 {
        font-size: 22px;
    }

    .ground-title {
        font-size: 25px;
    }

    .scoreboard {
        margin-top: 20px;
        gap: 5px;
    }

    .team-name {
        font-size: 22px;
        min-height: 55px;
        padding: 8px 5px;
    }

    .score {
        font-size: 70px;
    }

    .timer {
        font-size: 48px;
    }

    button {
        font-size: 15px;
        padding: 10px 12px;
    }

    .team-input {
        width: 90%;
        max-width: 300px;
    }

    .time-input {
        width: 90%;
        max-width: 200px;
    }

}

</style>

</head>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    databaseURL:
    "https://scoreboard-app-2faa3-default-rtdb.firebaseio.com"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


/* =====================================================
   GROUND DATA
===================================================== */

const ground = {

    1: {

        pin: "1516",

        scoreA: 0,
        scoreB: 0,

        matchMinutes: 20,

        totalSeconds: 0,

        timerRunning: false,

        timerStartAt: null,

        isAdmin: false

    },


    2: {

        pin: "4411",

        scoreA: 0,
        scoreB: 0,

        matchMinutes: 20,

        totalSeconds: 0,

        timerRunning: false,

        timerStartAt: null,

        isAdmin: false

    }

};


/* =====================================================
   ADMIN
===================================================== */

window.openAdmin = function(g) {


    if (ground[g].isAdmin) {

        logoutAdmin(g);

        return;

    }


    const pin =
        prompt(
            "Enter Ground " +
            g +
            " Admin PIN"
        );


    if (pin === ground[g].pin) {


        ground[g].isAdmin = true;


        document.getElementById(
            "adminStatus" + g
        ).innerText =
            "GROUND " +
            g +
            " ADMIN MODE ON";


        document.getElementById(
            "adminStatus" + g
        ).style.color =
            "lightgreen";


        /* SHOW SCORE BUTTONS */

        document.getElementById(
            "scoreControlA" + g
        ).style.display =
            "block";


        document.getElementById(
            "scoreControlB" + g
        ).style.display =
            "block";


        /* SHOW TIMER BUTTONS */

        document.getElementById(
            "timerControl" + g
        ).style.display =
            "block";


        /* SHOW SETTINGS */

        document.getElementById(
            "teamSettings" + g
        ).style.display =
            "block";


        /* CURRENT TEAM NAMES */

        document.getElementById(
            "teamAInput" + g
        ).value =
            document.getElementById(
                "teamAName" + g
            ).innerText;


        document.getElementById(
            "teamBInput" + g
        ).value =
            document.getElementById(
                "teamBName" + g
            ).innerText;


        /* CURRENT MATCH TIME */

        document.getElementById(
            "matchTimeInput" + g
        ).value =
            ground[g].matchMinutes;


        /* CHANGE BUTTON */

        const buttons =
            document.querySelectorAll(
                ".ground-box"
            );


        buttons[g - 1]
            .querySelector(".admin-btn")
            .innerText =
            "EXIT ADMIN";

    }


    else {

        alert("Wrong PIN!");

    }

};


/* =====================================================
   LOGOUT
===================================================== */

function logoutAdmin(g) {


    ground[g].isAdmin = false;


    document.getElementById(
        "adminStatus" + g
    ).innerText =
        "Viewing Mode";


    document.getElementById(
        "adminStatus" + g
    ).style.color =
        "yellow";


    document.getElementById(
        "scoreControlA" + g
    ).style.display =
        "none";


    document.getElementById(
        "scoreControlB" + g
    ).style.display =
        "none";


    document.getElementById(
        "timerControl" + g
    ).style.display =
        "none";


    document.getElementById(
        "teamSettings" + g
    ).style.display =
        "none";


    document.querySelectorAll(
        ".ground-box"
    )[g - 1]
    .querySelector(".admin-btn")
    .innerText =
        "ADMIN";

}


/* =====================================================
   FIREBASE LIVE DATA
===================================================== */

function loadGround(g) {


    onValue(

        ref(db, "ground" + g),

        function(snapshot) {


            const data =
                snapshot.val();


            if (!data) {

                return;

            }


            /* =========================
               SCORE
            ========================= */

            if (data.score) {


                ground[g].scoreA =
                    Number(
                        data.score.A || 0
                    );


                ground[g].scoreB =
                    Number(
                        data.score.B || 0
                    );

            }


            document.getElementById(
                "scoreA" + g
            ).innerText =
                ground[g].scoreA;


            document.getElementById(
                "scoreB" + g
            ).innerText =
                ground[g].scoreB;


            /* =========================
               TIMER
            ========================= */

            if (data.timer) {


                ground[g].matchMinutes =
                    Number(
                        data.timer.matchMinutes ?? 20
                    );


                ground[g].totalSeconds =
                    Number(
                        data.timer.time ?? 0
                    );


                ground[g].timerRunning =
                    data.timer.running || false;


                ground[g].timerStartAt =
                    data.timer.startAt || null;

            }


            /* =========================
               TEAM NAMES
            ========================= */

            if (data.teams) {


                if (data.teams.A) {

                    document.getElementById(
                        "teamAName" + g
                    ).innerText =
                        data.teams.A;

                }


                if (data.teams.B) {

                    document.getElementById(
                        "teamBName" + g
                    ).innerText =
                        data.teams.B;

                }

            }

        },

        function(error) {

            console.log(
                "Ground " +
                g +
                " Firebase error:",
                error
            );

        }

    );

}


/* LOAD BOTH GROUNDS */

loadGround(1);

loadGround(2);


/* =====================================================
   SAVE TEAM NAMES + TIME
===================================================== */

window.saveSettings =
function(g) {


    if (!ground[g].isAdmin) {

        alert(
            "Admin PIN required!"
        );

        return;

    }


    const teamA =
        document.getElementById(
            "teamAInput" + g
        ).value.trim();


    const teamB =
        document.getElementById(
            "teamBInput" + g
        ).value.trim();


    const newMatchMinutes =
        Number(
            document.getElementById(
                "matchTimeInput" + g
            ).value
        );


    if (teamA === "") {

        alert(
            "Enter Team A Name"
        );

        return;

    }


    if (teamB === "") {

        alert(
            "Enter Team B Name"
        );

        return;

    }


    if (
        !newMatchMinutes ||
        newMatchMinutes < 1
    ) {

        alert(
            "Enter Match Time in minutes"
        );

        return;

    }


    /* SCREEN */

    document.getElementById(
        "teamAName" + g
    ).innerText =
        teamA;


    document.getElementById(
        "teamBName" + g
    ).innerText =
        teamB;


    ground[g].matchMinutes =
        newMatchMinutes;


    /* RESET TIMER */

    ground[g].totalSeconds = 0;

    ground[g].timerRunning = false;

    ground[g].timerStartAt = null;


    document.getElementById(
        "timer" + g
    ).innerText =
        "0:00";


    /* SAVE TEAM NAMES */

    set(

        ref(
            db,
            "ground" + g + "/teams"
        ),

        {

            A: teamA,

            B: teamB

        }

    )
    .catch(function(error) {

        alert(
            "Team name save error: " +
            error.message
        );

    });


    /* SAVE TIME */

    set(

        ref(
            db,
            "ground" + g + "/timer"
        ),

        {

            time: 0,

            running: false,

            startAt: null,

            matchMinutes:
                ground[g].matchMinutes

        }

    )
    .then(function() {

        alert(
            "Ground " +
            g +
            " Team Names & Time Saved"
        );

    })
    .catch(function(error) {

        alert(
            "Time save error: " +
            error.message
        );

    });

};


/* =====================================================
   SCORE
===================================================== */

window.changeScore =
function(g, team, value) {


    if (!ground[g].isAdmin) {

        alert(
            "Admin PIN required!"
        );

        return;

    }


    if (team === "A") {


        ground[g].scoreA += value;


        if (
            ground[g].scoreA < 0
        ) {

            ground[g].scoreA = 0;

        }

    }


    if (team === "B") {


        ground[g].scoreB += value;


        if (
            ground[g].scoreB < 0
        ) {

            ground[g].scoreB = 0;

        }

    }


    document.getElementById(
        "scoreA" + g
    ).innerText =
        ground[g].scoreA;


    document.getElementById(
        "scoreB" + g
    ).innerText =
        ground[g].scoreB;


    /* SAVE */

    set(

        ref(
            db,
            "ground" + g + "/score"
        ),

        {

            A: ground[g].scoreA,

            B: ground[g].scoreB

        }

    )
    .catch(function(error) {

        alert(
            "Score save error: " +
            error.message
        );

    });

};


/* =====================================================
   TIMER DISPLAY
===================================================== */

function updateTimerDisplay(g) {


    let seconds =
        ground[g].totalSeconds;


    if (
        ground[g].timerRunning &&
        ground[g].timerStartAt
    ) {


        seconds =
            Math.floor(

                (
                    Date.now() -
                    ground[g].timerStartAt
                ) / 1000

            );

    }


    const maximumSeconds =
        ground[g].matchMinutes * 60;


    /* STOP AT MATCH TIME */

    if (
        seconds >= maximumSeconds
    ) {


        seconds =
            maximumSeconds;


        if (
            ground[g].timerRunning
        ) {


            ground[g].timerRunning =
                false;


            ground[g].totalSeconds =
                maximumSeconds;


            ground[g].timerStartAt =
                null;


            set(

                ref(
                    db,
                    "ground" +
                    g +
                    "/timer"
                ),

                {

                    time:
                        maximumSeconds,

                    running:
                        false,

                    startAt:
                        null,

                    matchMinutes:
                        ground[g]
                        .matchMinutes

                }

            );

        }

    }


    ground[g].totalSeconds =
        seconds;


    const minutes =
        Math.floor(
            seconds / 60
        );


    const sec =
        seconds % 60;


    document.getElementById(
        "timer" + g
    ).innerText =

        minutes +
        ":" +
        String(sec)
            .padStart(2, "0");

}


/* =====================================================
   TIMER LOOP
===================================================== */

setInterval(

    function() {

        updateTimerDisplay(1);

        updateTimerDisplay(2);

    },

    250

);


/* =====================================================
   START TIMER
===================================================== */

window.startTimer =
function(g) {


    if (!ground[g].isAdmin) {

        alert(
            "Admin PIN required!"
        );

        return;

    }


    if (
        ground[g].timerRunning
    ) {

        return;

    }


    const maximumSeconds =
        ground[g].matchMinutes * 60;


    if (
        ground[g].totalSeconds >=
        maximumSeconds
    ) {

        ground[g].totalSeconds =
            0;

    }


    ground[g].timerStartAt =

        Date.now() -
        (
            ground[g].totalSeconds *
            1000
        );


    ground[g].timerRunning =
        true;


    set(

        ref(
            db,
            "ground" +
            g +
            "/timer"
        ),

        {

            time:
                ground[g].totalSeconds,

            running:
                true,

            startAt:
                ground[g].timerStartAt,

            matchMinutes:
                ground[g].matchMinutes

        }

    )
    .catch(function(error) {

        alert(
            "Timer error: " +
            error.message
        );

    });

};


/* =====================================================
   STOP TIMER
===================================================== */

window.stopTimer =
function(g) {


    if (!ground[g].isAdmin) {

        alert(
            "Admin PIN required!"
        );

        return;

    }


    if (
        !ground[g].timerRunning
    ) {

        return;

    }


    ground[g].totalSeconds =

        Math.floor(

            (
                Date.now() -
                ground[g].timerStartAt
            ) / 1000

        );


    const maximumSeconds =
        ground[g].matchMinutes * 60;


    if (
        ground[g].totalSeconds >
        maximumSeconds
    ) {

        ground[g].totalSeconds =
            maximumSeconds;

    }


    ground[g].timerRunning =
        false;


    ground[g].timerStartAt =
        null;


    set(

        ref(
            db,
            "ground" +
            g +
            "/timer"
        ),

        {

            time:
                ground[g].totalSeconds,

            running:
                false,

            startAt:
                null,

            matchMinutes:
                ground[g].matchMinutes

        }

    )
    .catch(function(error) {

        alert(
            "Timer error: " +
            error.message
        );

    });

};


/* =====================================================
   RESET TIMER + SCORE
===================================================== */

window.resetTimer =
function(g) {


    if (!ground[g].isAdmin) {

        alert(
            "Admin PIN required!"
        );

        return;

    }


    /* SCORE RESET */

    ground[g].scoreA = 0;

    ground[g].scoreB = 0;


    document.getElementById(
        "scoreA" + g
    ).innerText =
        "0";


    document.getElementById(
        "scoreB" + g
    ).innerText =
        "0";


    /* TIMER RESET */

    ground[g].totalSeconds =
        0;


    ground[g].timerRunning =
        false;


    ground[g].timerStartAt =
        null;


    document.getElementById(
        "timer" + g
    ).innerText =
        "0:00";


    /* SAVE SCORE */

    set(

        ref(
            db,
            "ground" +
            g +
            "/score"
        ),

        {

            A: 0,

            B: 0

        }

    )
    .catch(function(error) {

        alert(
            "Score reset error: " +
            error.message
        );

    });


    /* SAVE TIMER */

    set(

        ref(
            db,
            "ground" +
            g +
            "/timer"
        ),

        {

            time: 0,

            running: false,

            startAt: null,

            matchMinutes:
                ground[g].matchMinutes

        }

    )
    .catch(function(error) {

        alert(
            "Timer reset error: " +
            error.message
        );

    });

};

</script>
